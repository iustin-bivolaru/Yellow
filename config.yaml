# Yellow configuration. No secrets here: ANTHROPIC_API_KEY / GITHUB_TOKEN come from the environment.

timezone: Europe/Bucharest   # used for display and the 9 AM gate; all stored times are UTC
run_hour: 9                  # local hour at which the scheduled run is allowed to publish

site:
  title: Yellow
  base_url: ""               # set to "/<repo-name>/" for GitHub Pages project sites
  archive_days: 30

http:
  user_agent: "YellowDigest/0.1 (daily news digest; +https://github.com/)"
  timeout_seconds: 20

llm:
  model: claude-haiku-5-5    # alternative: claude-sonnet-5-5 (never Opus)
  effort: low
  max_tokens: 32000          # ceiling, not spend: ~100-130 output tokens/item + thinking
  max_items: 150             # items sent to Claude per run
  snippet_chars: 300

caps:
  lookback_hours: 26         # how far back sources look
  max_items_per_source: 40
  seen_retention_days: 30    # how long data/seen.json remembers an item

categories:
  - AI Models & Releases
  - AI Agents & Tools
  - AI Research
  - Dev Tools & Frameworks
  - Open Source
  - Cloud & Infra
  - Security
  - Industry & Funding
  - Other Tech

sources:
  hackernews:
    enabled: true
    min_points: 50
  reddit:
    enabled: true
    subreddits: [MachineLearning, LocalLLaMA, artificial, programming]
  arxiv:
    enabled: true
    categories: [cs.AI, cs.CL, cs.LG]
    max_items: 15
  huggingface:
    enabled: true
    papers: true
    models: true
    model_max_age_days: 14   # trending models are rarely < 1 day old; seen.json stops repeats
    max_models: 10
  github_trending:
    enabled: true            # uses GITHUB_TOKEN from the environment when set (higher rate limit)
    query: "llm OR agent OR ai"
    min_stars: 100
    created_within_days: 7
    max_items: 15
  x:
    enabled: false           # paid API; needs X_BEARER_TOKEN
  rss:
    enabled: true
    # Each URL verified 2026-11-12. Anthropic and Meta AI publish no RSS feed, so they're omitted.
    feeds:
      - {name: OpenAI, url: "https://openai.com/news/rss.xml"}
      - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml"}
      - {name: Hugging Face, url: "https://huggingface.co/blog/feed.xml"}
      - {name: Mistral AI, url: "https://mistral.ai/rss.xml"}
      - {name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/"}
      - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
      - {name: The Verge AI, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/technology-lab"}
      - {name: InfoQ AI, url: "https://feed.infoq.com/ai-ml-data-eng/"}
