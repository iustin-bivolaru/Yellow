# Daily digest: collect, analyze, render, save state to the `data` branch, deploy to Pages.
# The bot never commits to `main`; all state lives on the orphan `data` branch. Three jobs keep the
# write token away from code that parses feeds: build (read-only) -> persist (write, no project
# code) -> deploy (Pages).
name: Daily digest

on:
  schedule:
    # Bucharest 09:00 is 06:00 UTC in summer and 07:00 UTC in winter. The later crons are
    # retries: the CLI's --scheduled gate makes extra runs no-ops once today's digest exists.
    # Minute 17, not 0: GitHub delays or drops on-the-hour schedules most (hours late seen).
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run without the 9 AM gate (no --scheduled)"
        type: boolean
        default: false
      no_llm:
        description: "Keyword-only digest, no Claude call"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
      state_changed: ${{ steps.state.outputs.state_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the data branch (read-only)
        run: |
          rc=0
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth 1 origin data
            mkdir data
            git archive FETCH_HEAD | tar -x -C data
          elif [ "$rc" -eq 2 ]; then
            echo "No data branch yet (first run)."
            mkdir data
          else
            echo "git ls-remote failed with exit code $rc" >&2
            exit "$rc"
          fi
          cp -R data "$RUNNER_TEMP/data-before"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      # The daily call runs through the Claude Code CLI on the user's subscription (pinned version).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Run the digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ inputs.force }}
          NO_LLM: ${{ inputs.no_llm }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          args=()
          if [ "$FORCE" != "true" ]; then args+=(--scheduled); fi
          if [ "$NO_LLM" = "true" ]; then args+=(--no-llm); fi
          python -m yellow run "${args[@]}"

      - name: Detect state changes
        id: state
        run: |
          if diff -r "$RUNNER_TEMP/data-before" data >/dev/null; then
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "state_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.state.outputs.state_changed == 'true'
        with:
          name: data-state
          path: data/
          if-no-files-found: error

      - name: Check for a rendered site
        id: site
        run: |
          if [ -f site/index.html ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.deploy == 'true'
        with:
          path: site

  persist:
    # Runs no project code and no pip: it only moves the state files onto the data branch.
    needs: build
    if: needs.build.outputs.state_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up the data worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          rc=0
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch origin data:data
            git worktree add data data
          elif [ "$rc" -eq 2 ]; then
            git worktree add --orphan -b data data
          else
            echo "git ls-remote failed with exit code $rc" >&2
            exit "$rc"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: data-state
          path: ${{ runner.temp }}/data-state

      - name: Commit and push the state
        env:
          STATE_DIR: ${{ runner.temp }}/data-state
        run: |
          rsync -a --delete --exclude '.git' "$STATE_DIR"/ data/
          if [ -z "$(git -C data status --porcelain)" ]; then
            echo "No state changes."
            exit 0
          fi
          newest=$(ls data/digests 2>/dev/null | sort | tail -1)
          day="${newest%.json}"
          git -C data add -A
          git -C data commit -m "data: digest ${day:-$(date -u +%F)}"
          git -C data push origin data

  deploy:
    needs: [build, persist]
    if: >-
      always() && needs.build.result == 'success'
      && needs.build.outputs.deploy == 'true'
      && (needs.persist.result == 'success' || needs.persist.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
