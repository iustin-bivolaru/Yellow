[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yellow"
version = "0.1.0"
description = "Daily AI/IT news digest rendered as a yellow phone PWA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yellow = "yellow.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yellow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test names describe the test; tests/test_docstrings.py covers src/
