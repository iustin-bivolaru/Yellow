<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD400">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="manifest" href="{{ root }}manifest.json">
<link rel="icon" href="{{ root }}icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ root }}icon-192.png">
<link rel="stylesheet" href="{{ root }}style.css">
<script src="{{ root }}app.js" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ root }}index.html">{{ site_title }}</a>
  <span class="header-date">{% block header_date %}{% endblock %}</span>
  <a class="icon-btn" href="#archive" aria-label="Archive: last days">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
  </a>
</header>
<main>
{% block main %}{% endblock %}
</main>
{% block footer %}{% endblock %}
</body>
</html>
